name: DPM ONE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dpm-one-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API tests
        env:
          DATABASE_URL: sqlite:///./ci-test.db
          JWT_SECRET_KEY: ci-only-test-secret-do-not-use-in-production
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Verify database migrations
        env:
          DATABASE_URL: sqlite:///./migration-test.db
          JWT_SECRET_KEY: ci-only-test-secret-do-not-use-in-production
          PYTHONPATH: .
        run: alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: TypeScript and production build
        run: npm run build

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate cloud Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.cloud.yml config --quiet
          echo "CLOUDFLARE_TUNNEL_TOKEN=ci-placeholder-token" >> .env
          docker compose -f docker-compose.yml -f docker-compose.office.yml config --quiet
